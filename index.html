html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;font-size:16px}

.mut{color:var(--mut);font-size:14px;margin:4px 0 8px}
.tg{display:flex;gap:6px}.tg button{flex:1;padding:4px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:16px}.tg button.on{background:var(--pri);color:var(--ptx)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.bar{height:9px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card,.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:7px 0}
.card.off{opacity:.5}.card span.s{display:block;color:var(--mut);font-size:13px}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--pri);color:var(--ptx);text-align:center;line-height:30px;font-weight:700;font-size:14px}
.opt{font-size:17px}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.pri,.gh{display:block;width:100%;border-radius:14px;padding:11px;margin:8px 0;font-weight:700;border:0}
.pri{background:var(--pri);color:var(--ptx)}.gh{background:var(--card);border:1px solid var(--bd)}
.two{display:flex;gap:8px}.two button{flex:1}
.back{background:none;border:0;color:var(--pri);padding:2px 0;font-size:15px}
.fc{background:var(--card);border:2px solid var(--pri);border-radius:18px;padding:14px 16px;margin:8px 0}.fc p{font-size:18px}
.tip{background:var(--tip);border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 14px;margin:8px 0}
.big{font-size:46px;text-align:center;line-height:1.3;color:var(--pri);font-weight:700}
.row{display:flex;justify-content:space-between;font-size:14px}
svg.il{width:100%;max-height:120px;display:block;margin:4px 0}
.p,.fl,.bn{transform-box:fill-box;transform-origin:center}
.p{animation:pl 2s infinite ease-in-out}@keyframes pl{50%{transform:scale(1.25)}}
.fl{animation:fk .6s infinite alternate}@keyframes fk{to{transform:scale(1.2) rotate(6deg)}}
.bn{animation:bn 1.2s infinite}@keyframes bn{50%{transform:translateY(-8px)}}
.f{animation:fd 3s infinite}@keyframes fd{0%,15%{opacity:.1}40%,100%{opacity:1}}
select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px;width:100%}
</style>
</head>

function tr37save(a){localStorage.setItem(TR37KEY,JSON.stringify(a))}
function train37(){clearInterval(TM);ap();let ar=S.lg=='ar',a=tr37get(),today=new Date().toISOString().slice(0,10),expired=a.filter(x=>x.expiry&&x.expiry<today).length,soon=a.filter(x=>x.expiry&&x.expiry>=today&&x.expiry<=new Date(Date.now()+30*86400000).toISOString().slice(0,10)).length;A.innerHTML='<button class="back" onclick="home()">'+t('back')+'</button><h2>🎓 '+(ar?'إدارة التدريب والكفاءات':'Training & Competency Matrix')+'</h2><p class="mut">'+(ar?'سجل تدريب الموظفين، الكفاءات، الشهادات ومواعيد انتهاء الصلاحية.':'Employee training, competency, certificates and expiry dates.')+'</p><div class="two"><div class="box"><b>🔴 '+(ar?'منتهية':'Expired')+'</b><h2>'+expired+'</h2></div><div class="box"><b>🟡 '+(ar?'خلال 30 يوم':'Due within 30 days')+'</b><h2>'+soon+'</h2></div></div><button class="pri" onclick="tr37form()">＋ '+(ar?'إضافة سجل تدريب':'Add training record')+'</button><button class="gh" onclick="tr37export()">📤 '+(ar?'تصدير JSON':'Export JSON')+'</button><button class="gh" onclick="window.print()">🖨️ '+(ar?'طباعة':'Print')+'</button><input id="tr37q" placeholder="'+(ar?'بحث بالموظف أو الدورة أو القسم':'Search employee, course or department')+'" oninput="tr37list()"><div id="tr37list"></div>';tr37list();scrollTo(0,0)}
function tr37form(id){let ar=S.lg=='ar',old=id?tr37get().find(x=>x.id==id):null;A.innerHTML='<button class="back" onclick="train37()">'+t('back')+'</button><h2>📝 '+(ar?'بيانات التدريب':'Training details')+'</h2><div class="box"><label>'+(ar?'اسم الموظف':'Employee name')+'</label><input id="tr37name" value="'+escTB(old?.name||'')+'" required><label>'+(ar?'رقم الموظف (اختياري)':'Employee ID (optional)')+'</label><input id="tr37emp" value="'+escTB(old?.empId||'')+'"><label>'+(ar?'القسم / الوظيفة':'Department / job')+'</label><input id="tr37dept" value="'+escTB(old?.dept||'')+'"><label>'+(ar?'اسم الدورة أو الكفاءة':'Course / competency')+'</label><input id="tr37course" value="'+escTB(old?.course||'')+'" required><label>'+(ar?'نوع التدريب':'Training type')+'</label><select id="tr37type"><option>Internal</option><option>External</option><option>Online</option><option>On-job</option></select><label>'+(ar?'المدرب أو الجهة':'Trainer / provider')+'</label><input id="tr37trainer" value="'+escTB(old?.trainer||'')+'"><label>'+(ar?'تاريخ التدريب':'Training date')+'</label><input id="tr37date" type="date" value="'+escTB(old?.date||'')+'"><label>'+(ar?'تاريخ انتهاء الشهادة (إن وجد)':'Certificate expiry (if any)')+'</label><input id="tr37expiry" type="date" value="'+escTB(old?.expiry||'')+'"><label>'+(ar?'الدرجة / التقييم':'Score / assessment')+'</label><input id="tr37score" value="'+escTB(old?.score||'')+'" placeholder="e.g. 85% / Competent"><label>'+(ar?'حالة السجل':'Record status')+'</label><select id="tr37status"><option value="planned">'+(ar?'مخطط':'Planned')+'</option><option value="completed">'+(ar?'مكتمل':'Completed')+'</option><option value="renew">'+(ar?'يحتاج تجديد':'Renewal required')+'</option><option value="incomplete">'+(ar?'غير مكتمل':'Incomplete')+'</option></select><label>'+(ar?'ملاحظات / تدريب إضافي مطلوب':'Notes / further training required')+'</label><textarea id="tr37notes" rows="3">'+escTB(old?.notes||'')+'</textarea><button class="pri" onclick="tr37saveform('+ (old?old.id:'null')+')">💾 '+(ar?'حفظ':'Save record')+'</button></div>';if(old){document.getElementById('tr37type').value=old.type||'Internal';document.getElementById('tr37status').value=old.status||'planned'}scrollTo(0,0)}
function tr37saveform(id){let name=document.getElementById('tr37name').value.trim(),course=document.getElementById('tr37course').value.trim();if(!name||!course){alert(S.lg=='ar'?'أدخل اسم الموظف والدورة':'Employee and course are required');return}let a=tr37get(),o={id:id||Date.now(),name,empId:document.getElementById('tr37emp').value,dept:document.getElementById('tr37dept').value,course,type:document.getElementById('tr37type').value,trainer:document.getElementById('tr37trainer').value,date:document.getElementById('tr37date').value,expiry:document.getElementById('tr37expiry').value,score:document.getElementById('tr37score').value,status:document.getElementById('tr37status').value,notes:document.getElementById('tr37notes').value,updated:new Date().toISOString()};let i=a.findIndex(x=>x.id==o.id);if(i>=0)a[i]=o;else{o.created=o.updated;a.unshift(o)}tr37save(a);train37()}
function tr37list(){let ar=S.lg=='ar',q=(document.getElementById('tr37q')?.value||'').toLowerCase(),el=document.getElementById('tr37list'),today=new Date().toISOString().slice(0,10);if(!el)return;let a=tr37get().filter(x=>[x.name,x.empId,x.dept,x.course,x.trainer,x.type,x.notes].some(v=>String(v||'').toLowerCase().includes(q)));a.sort((x,y)=>(x.expiry||'9999').localeCompare(y.expiry||'9999'));el.innerHTML=a.length?a.map(o=>{let exp=o.expiry&&o.expiry<today?'expired':o.expiry&&o.expiry<=new Date(Date.now()+30*86400000).toISOString().slice(0,10)?'soon':'ok',label=exp=='expired'?(ar?'منتهية الصلاحية':'Expired'):exp=='soon'?(ar?'قريبة الانتهاء':'Expiring soon'):(ar?'سارية / غير محددة':'Valid / not set'),status={planned:ar?'مخطط':'Planned',completed:ar?'مكتمل':'Completed',renew:ar?'يحتاج تجديد':'Renewal required',incomplete:ar?'غير مكتمل':'Incomplete'}[o.status]||'';return '<div class="box"><div class="row"><b>'+escTB(o.name)+'</b><span class="chip">'+label+'</span></div><h3>'+escTB(o.course)+'</h3><p class="mut">'+escTB(o.dept||'—')+' · '+(ar?'رقم الموظف: ':'ID: ')+escTB(o.empId||'—')+'</p><p>'+ (ar?'تاريخ التدريب: ':'Training date: ')+escTB(o.date||'—')+' · '+(ar?'الانتهاء: ':'Expiry: ')+escTB(o.expiry||'—')+'</p><p>'+ (ar?'المدرب: ':'Trainer: ')+escTB(o.trainer||'—')+' · '+(ar?'الدرجة: ':'Score: ')+escTB(o.score||'—')+' · '+status+'</p><p>'+escTB(o.notes||'')+'</p><button class="gh" onclick="tr37form('+o.id+')">✏️ '+(ar?'تعديل':'Edit')+'</button><button class="gh" onclick="tr37del('+o.id+')">🗑️ '+(ar?'حذف':'Delete')+'</button></div>'}).join(''):'<div class="tip">'+(ar?'لا توجد سجلات تدريب.':'No training records found.')+'</div>'}
function tr37del(id){if(!confirm(S.lg=='ar'?'حذف سجل التدريب؟':'Delete training record?'))return;tr37save(tr37get().filter(x=>x.id!=id));train37()}
function tr37export(){let b=new Blob([JSON.stringify(tr37get(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='Abqari_Training_Competency.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}


// Phase 38: HSE KPI records and dashboard (user-entered monthly figures)
const KPI38KEY='abqari_hse_kpi_v1';
function kpi38get(){try{return JSON.parse(localStorage.getItem(KPI38KEY)||'[]')}catch(e){return []}}
function kpi38save(a){localStorage.setItem(KPI38KEY,JSON.stringify(a))}
function kpi38(){clearInterval(TM);ap();let ar=S.lg=='ar',a=kpi38get().sort((x,y)=>(y.period||'').localeCompare(x.period||''));let totals=a.reduce((t,x)=>{['hours','injuries','lostTime','nearMiss','actions','closed','highRisk','inspections','findings'].forEach(k=>t[k]+=Number(x[k]||0));return t},{hours:0,injuries:0,lostTime:0,nearMiss:0,actions:0,closed:0,highRisk:0,inspections:0,findings:0});let trir=totals.hours?totals.injuries*200000/totals.hours:0,ltifr=totals.hours?totals.lostTime*1000000/totals.hours:0,closure=totals.actions?totals.closed*100/totals.actions:0;
A.innerHTML='<button class="back" onclick="home()">'+t('back')+'</button><h2>📊 '+(ar?'مؤشرات أداء السلامة HSE':'HSE KPI Dashboard')+'</h2><p class="mut">'+(ar?'لوحة مؤشرات مبنية على الأرقام التي تدخلها لكل شهر. أدخل بيانات الفترة بصورة دقيقة ولا تستخدمها بديلاً عن سجلات الحوادث الرسمية.':'Dashboard based on monthly figures you enter. Use verified data; this does not replace official incident records.')+'</p><div class="two"><div class="box"><b>🕒 '+(ar?'ساعات العمل':'Work hours')+'</b><h2>'+totals.hours.toLocaleString()+'</h2></div><div class="box"><b>🩹 '+(ar?'إصابات مسجلة':'Recorded injuries')+'</b><h2>'+totals.injuries+'</h2></div><div class="box"><b>⚠️ Near Miss</b><h2>'+totals.nearMiss+'</h2></div><div class="box"><b>🔴 '+(ar?'مخاطر عالية مفتوحة':'Open high risks')+'</b><h2>'+totals.highRisk+'</h2></div><div class="box"><b>📈 TRIR</b><h2>'+trir.toFixed(2)+'</h2><small>'+ (ar?'لكل 200,000 ساعة':'per 200,000 hours')+'</small></div><div class="box"><b>📈 LTIFR</b><h2>'+ltifr.toFixed(2)+'</h2><small>'+ (ar?'لكل مليون ساعة':'per 1 million hours')+'</small></div><div class="box"><b>✅ '+(ar?'إغلاق الإجراءات':'Action closure')+'</b><h2>'+closure.toFixed(1)+'%</h2></div><div class="box"><b>🔎 '+(ar?'ملاحظات التفتيش':'Inspection findings')+'</b><h2>'+totals.findings+'</h2></div></div><button class="pri" onclick="kpi38form()">＋ '+(ar?'إضافة بيانات شهرية':'Add monthly KPI data')+'</button><button class="gh" onclick="kpi38export()">📤 '+(ar?'تصدير JSON':'Export JSON')+'</button><button class="gh" onclick="window.print()">🖨️ '+(ar?'طباعة / PDF':'Print / PDF')+'</button><h3>'+(ar?'الاتجاه الشهري — ساعات العمل':'Monthly work-hours trend')+'</h3><div id="kpi38chart"></div><div id="kpi38list"></div>';kpi38render();scrollTo(0,0)}
function kpi38form(id){let ar=S.lg=='ar',old=id?kpi38get().find(x=>x.id==id):null;A.innerHTML='<button class="back" onclick="kpi38()">'+t('back')+'</button><h2>📝 '+(ar?'بيانات مؤشرات الشهر':'Monthly KPI data')+'</h2><div class="box"><label>'+(ar?'الشهر (YYYY-MM)':'Month (YYYY-MM)')+'</label><input id="k38period" type="month" value="'+escTB(old?.period||new Date().toISOString().slice(0,7))+'" required><label>'+(ar?'ساعات العمل الكلية':'Total work hours')+'</label><input id="k38hours" type="number" min="0" value="'+escTB(old?.hours||0)+'"><label>'+(ar?'عدد الإصابات المسجلة':'Recordable injuries')+'</label><input id="k38inj" type="number" min="0" value="'+escTB(old?.injuries||0)+'"><label>'+(ar?'إصابات مع فقدان وقت (LTI)':'Lost-time injuries (LTI)')+'</label><input id="k38lti" type="number" min="0" value="'+escTB(old?.lostTime||0)+'"><label>Near Miss</label><input id="k38near" type="number" min="0" value="'+escTB(old?.nearMiss||0)+'"><label>'+(ar?'الإجراءات التصحيحية الكلية':'Total corrective actions')+'</label><input id="k38actions" type="number" min="0" value="'+escTB(old?.actions||0)+'"><label>'+(ar?'الإجراءات المغلقة':'Actions closed')+'</label><input id="k38closed" type="number" min="0" value="'+escTB(old?.closed||0)+'"><label>'+(ar?'المخاطر العالية/الحرجة المفتوحة':'Open high/critical risks')+'</label><input id="k38risk" type="number" min="0" value="'+escTB(old?.highRisk||0)+'"><label>'+(ar?'عدد التفتيشات':'Inspections conducted')+'</label><input id="k38inspect" type="number" min="0" value="'+escTB(old?.inspections||0)+'"><label>'+(ar?'ملاحظات التفتيش المكتشفة':'Inspection findings')+'</label><input id="k38findings" type="number" min="0" value="'+escTB(old?.findings||0)+'"><label>'+(ar?'ملاحظات إضافية':'Notes')+'</label><textarea id="k38notes" rows="3">'+escTB(old?.notes||'')+'</textarea><button class="pri" onclick="kpi38saveform('+ (old?old.id:'null')+')">💾 '+(ar?'حفظ البيانات':'Save data')+'</button></div>';scrollTo(0,0)}
function kpi38saveform(id){let period=document.getElementById('k38period').value,hours=Number(document.getElementById('k38hours').value||0),injuries=Number(document.getElementById('k38inj').value||0),lostTime=Number(document.getElementById('k38lti').value||0),actions=Number(document.getElementById('k38actions').value||0),closed=Number(document.getElementById('k38closed').value||0);if(!period){alert(S.lg=='ar'?'حدد الشهر':'Choose month');return}if(hours<=0){alert(S.lg=='ar'?'ساعات العمل يجب أن تكون أكبر من صفر لحساب المعدلات':'Work hours must be greater than zero to calculate rates');return}if(closed>actions){alert(S.lg=='ar'?'عدد الإجراءات المغلقة لا يمكن أن يتجاوز الكلي':'Closed actions cannot exceed total actions');return}if(lostTime>injuries){alert(S.lg=='ar'?'LTI لا يمكن أن يتجاوز عدد الإصابات':'LTI cannot exceed total injuries');return}let o={id:id||Date.now(),period,hours,injuries,lostTime,nearMiss:Number(document.getElementById('k38near').value||0),actions,closed,highRisk:Number(document.getElementById('k38risk').value||0),inspections:Number(document.getElementById('k38inspect').value||0),findings:Number(document.getElementById('k38findings').value||0),notes:document.getElementById('k38notes').value,updated:new Date().toISOString()},a=kpi38get(),i=a.findIndex(x=>x.id==o.id);if(i>=0)a[i]=o;else{let du=a.findIndex(x=>x.period==period);if(du>=0){if(!confirm(S.lg=='ar'?'يوجد سجل لهذا الشهر، استبداله؟':'A record exists for this month. Replace it?'))return;o.id=a[du].id;a[du]=o}else{o.created=o.updated;a.unshift(o)}}kpi38save(a);kpi38()}

function kpi38del(id){if(!confirm(S.lg=='ar'?'حذف سجل KPI؟':'Delete KPI record?'))return;kpi38save(kpi38get().filter(x=>x.id!=id));kpi38()}

="m52status"><option value="ready">'+(ar?'جاهز':'Ready')+'</option><option value="needs">'+(ar?'يحتاج تجهيز/متابعة':'Needs replenishment / follow-up')+'</option><option value="retired">'+(ar?'مستبعد':'Retired')+'</option></select><label>'+(ar?'ملاحظات / مرجع':'Notes / reference')+'</label><textarea id="m52notes" rows="2">'+escTB(o?.notes||'')+'</textarea><button class="pri" onclick="m52saveform('+ (o?o.id:'null')+')">💾 '+(ar?'حفظ':'Save')+'</button></div>';if(o){document.getElementById('m52type').value=o.type||'kit';document.getElementById('m52status').value=o.status||'ready'}scrollTo(0,0)}
function m52saveform(id){let ar=S.lg==='ar',code=document.getElementById('m52code').value.trim(),name=document.getElementById('m52name').value.trim(),loc=document.getElementById('m52loc').value.trim(),date=document.getElementById('m52date').value;if(!code||!name||!loc||!date){alert(ar?'الرقم والاسم والموقع وتاريخ الفحص مطلوبة':'ID, name, location and inspection date are required');return}let a=m52get();if(a.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!=id)){alert(ar?'رقم السجل مستخدم':'Duplicate record ID');return}let o={id:id||Date.now(),code,type:document.getElementById('m52type').value,name,loc,date,expiry:document.getElementById('m52expiry').value,items:document.getElementById('m52items').value,check:document.getElementById('m52check').value,action:document.getElementById('m52action').value,owner:document.getElementById('m52owner').value,status:document.getElementById('m52status').value,notes:document.getElementById('m52notes').value,updated:new Date().toISOString()};let i=a.findIndex(x=>x.id==o.id);if(i>=0)a[i]=o;else a.unshift(o);m52save(a);med52()}
function m52list(){let el=document.getElementById('m52list'),ar=S.lg==='ar',q=(document.getElementById('m52q')?.value||'').toLowerCase(),a=m52get(),today=new Date().toISOString().slice(0,10),type={kit:ar?'حقيبة إسعاف':'First aid kit',station:ar?'نقطة إسعاف':'First aid station',aed:'AED',stretcher:ar?'نقالة':'Stretcher',eyewash:ar?'غسول عين':'Eyewash',other:ar?'أخرى':'Other'},status={ready:ar?'جاهز':'Ready',needs:ar?'يحتاج متابعة':'Needs follow-up',retired:ar?'مستبعد':'Retired'};if(!el)return;a=a.filter(x=>[x.code,x.name,x.loc,x.owner,x.items,x.action].some(v=>(v||'').toLowerCase().includes(q)));el.innerHTML=a.length?a.map(x=>{let exp=x.expiry&&x.expiry<today&&x.status!=='retired',soon=x.expiry&&x.expiry>=today&&x.expiry<=new Date(Date.now()+30*86400000).toISOString().slice(0,10);return '<div class="box"><b>'+escTB(x.code)+' · '+escTB(x.name)+'</b><span class="chip">'+escTB(status[x.status]||x.status)+'</span><p>'+escTB(type[x.type]||x.type)+' · '+escTB(x.loc)+'</p><p>'+(ar?'الفحص: ':'Inspected: ')+escTB(x.date)+' · '+(ar?'الصلاحية: ':'Expiry: ')+escTB(x.expiry||'—')+(exp?' 🔴 '+(ar?'منتهية':'Expired'):soon?' 🟡 '+(ar?'قريبة':'Due soon'):'')+'</p><p><b>'+(ar?'المخزون: ':'Inventory: ')+'</b>'+escTB(x.items||'—')+'</p><p><b>'+(ar?'الفحص: ':'Check: ')+'</b>'+escTB(x.check||'—')+'</p><p><b>'+(ar?'الإجراء: ':'Action: ')+'</b>'+escTB(x.action||'—')+'</p><p>'+(ar?'المسؤول: ':'Owner: ')+escTB(x.owner||'—')+' · '+escTB(x.notes||'')+'</p><button class="gh" onclick="m52form('+x.id+')">✏️ '+(ar?'تعديل':'Edit')+'</button><button class="gh" onclick="m52del('+x.id+')">🗑️ '+(ar?'حذف':'Delete')+'</button></div>'}).join(''):'<div class="tip">'+(ar?'لا توجد سجلات.':'No records yet.')+'</div>'}
function m52del(id){if(!confirm(S.lg==='ar'?'حذف سجل الإسعافات؟':'Delete first aid record?'))return;m52save(m52get().filter(x=>x.id!=id));med52()}
function m52export(){let b=new Blob([JSON.stringify(m52get(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Abqari_HSE_FirstAid_Medical_Readiness.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}



// Phase 53: Training session delivery and attendance log
const TR53KEY='abqari_hse_training_sessions_v53';
function tr53get(){try{return JSON.parse(localStorage.getItem(TR53KEY)||'[]')}catch(e){return []}}
function tr53save(a){localStorage.setItem(TR53KEY,JSON.stringify(a))}
function train53(){clearInterval(TM);ap();let ar=S.lg==='ar',a=tr53get(),today=new Date().toISOString().slice(0,10),done=a.filter(x=>x.status==='completed').length;
A.innerHTML='<button class="back" onclick="home()">'+t('back')+'</button><h2>🗓️ '+(ar?'جلسات التدريب والحضور':'Training Sessions & Attendance')+'</h2><div class="two"><div class="box"><b>'+(ar?'الجلسات':'Sessions')+'</b><h2>'+a.length+'</h2></div><div class="box"><b>'+(ar?'المكتملة':'Completed')+'</b><h2>'+done+'</h2></div></div><p class="mut">'+(ar?'سجل تنفيذ جلسات التدريب والتوعية والحضور والتقييم، منفصل عن مصفوفة كفاءة الموظفين.':'Log training delivery, toolbox sessions, attendance and assessment separately from the competency matrix.')+'</p><button class="pri" onclick="tr53form()">＋ '+(ar?'جلسة تدريب جديدة':'New session')+'</button><button class="gh" onclick="tr53export()">📤 JSON</button><button class="gh" onclick="window.print()">🖨️ '+(ar?'طباعة':'Print')+'</button><input id="tr53q" placeholder="'+(ar?'بحث بالعنوان أو المدرب أو القسم':'Search topic, trainer or department')+'" oninput="tr53list()"><div id="tr53list"></div>';tr53list()}
function tr53form(id){let ar=S.lg==='ar',o=tr53get().find(x=>x.id==id)||{};A.innerHTML='<button class="back" onclick="train53()">'+t('back')+'</button><h2>📝 '+(ar?'بيانات جلسة التدريب':'Training session details')+'</h2><label>'+(ar?'عنوان / موضوع التدريب *':'Training topic *')+'</label><input id="tr53topic" value="'+escTB(o.topic||'')+'"><label>'+(ar?'نوع التدريب':'Training type')+'</label><select id="tr53type">'+[['toolbox','Toolbox Talk'],['induction','Safety Induction'],['course','Course'],['drill','Drill'],['awareness','Awareness']].map(x=>'<option value="'+x[0]+'" '+(o.type==x[0]?'selected':'')+'>'+ (ar?({'toolbox':'اجتماع توعية Toolbox','induction':'تعريف سلامة','course':'دورة','drill':'تمرين','awareness':'توعية'}[x[0]]):x[1])+'</option>').join('')+'</select><label>'+(ar?'القسم / الموقع':'Department / site')+'</label><input id="tr53dept" value="'+escTB(o.department||'')+'"><label>'+(ar?'المدرب / مقدم الجلسة':'Trainer / facilitator')+'</label><input id="tr53trainer" value="'+escTB(o.trainer||'')+'"><label>'+(ar?'التاريخ':'Date')+'</label><input id="tr53date" type="date" value="'+escTB(o.date||todayISO53())+'"><label>'+(ar?'المدة (دقيقة)':'Duration (minutes)')+'</label><input id="tr53duration" type="number" min="0" value="'+escTB(o.duration||'')+'"><label>'+(ar?'الحضور (اسم كل شخص بسطر)':'Attendees (one name per line)')+'</label><textarea id="tr53att" rows="5">'+escTB(o.attendees||'')+'</textarea><label>'+(ar?'عدد الحضور':'Attendance count')+'</label><input id="tr53count" type="number" min="0" value="'+escTB(o.count??'')+'"><label>'+(ar?'التقييم / نتيجة الاختبار':'Assessment / quiz result')+'</label><input id="tr53score" value="'+escTB(o.score||'')+'"><label>'+(ar?'ملاحظات والدروس المستفادة':'Notes / lessons learned')+'</label><textarea id="tr53notes" rows="3">'+escTB(o.notes||'')+'</textarea><label>'+(ar?'الإجراءات المطلوبة':'Follow-up actions')+'</label><textarea id="tr53actions" rows="3">'+escTB(o.actions||'')+'</textarea><label>'+(ar?'الحالة':'Status')+'</label><select id="tr53status"><option value="planned">'+(ar?'مخطط':'Planned')+'</option><option value="completed">'+(ar?'مكتمل':'Completed')+'</option><option value="cancelled">'+(ar?'ملغى':'Cancelled')+'</option></select><button class="pri" onclick="tr53saveform('+ (o.id||'null')+')">💾 '+(ar?'حفظ':'Save')+'</button>';if(o.status)document.getElementById('tr53status').value=o.status;scrollTo(0,0)}
function todayISO53(){return new Date().toISOString().slice(0,10)}
function tr53saveform(id){let ar=S.lg==='ar',topic=document.getElementById('tr53topic').value.trim(),date=document.getElementById('tr53date').value;if(!topic||!date){alert(ar?'عنوان التدريب والتاريخ مطلوبان':'Topic and date are required');return}let a=tr53get(),o={id:id||Date.now(),topic,type:document.getElementById('tr53type').value,department:document.getElementById('tr53dept').value,trainer:document.getElementById('tr53trainer').value,date,duration:document.getElementById('tr53duration').value,attendees:document.getElementById('tr53att').value,count:document.getElementById('tr53count').value,score:document.getElementById('tr53score').value,notes:document.getElementById('tr53notes').value,actions:document.getElementById('tr53actions').value,status:document.getElementById('tr53status').value,updated:new Date().toISOString()},i=a.findIndex(x=>x.id==o.id);if(i>=0)a[i]=o;else{o.created=o.updated;a.unshift(o)}tr53save(a);train53()}
function tr53list(){let ar=S.lg==='ar',q=(document.getElementById('tr53q')?.value||'').toLowerCase(),el=document.getElementById('tr53list');if(!el)return;let a=tr53get().filter(x=>[x.topic,x.department,x.trainer,x.attendees,x.notes].some(v=>String(v||'').toLowerCase().includes(q)));el.innerHTML=a.length?a.map(x=>'<div class="box"><div class="row"><b>'+escTB(x.topic)+'</b><span class="chip">'+escTB(ar?({'planned':'مخطط','completed':'مكتمل','cancelled':'ملغى'}[x.status]||x.status):x.status)+'</span></div><p>'+escTB(x.date)+' · '+escTB(x.department||'—')+' · '+escTB(x.trainer||'—')+'</p><p>'+(ar?'النوع: ':'Type: ')+escTB(x.type)+' · '+(ar?'المدة: ':'Duration: ')+escTB(x.duration||'—')+' '+(ar?'دقيقة':'min')+'</p><p>'+(ar?'عدد الحضور: ':'Attendees: ')+escTB(x.count||'—')+'</p><p>'+(ar?'التقييم: ':'Assessment: ')+escTB(x.score||'—')+'</p><p><b>'+(ar?'الإجراءات: ':'Follow-up: ')+'</b>'+escTB(x.actions||'—')+'</p><button class="gh" onclick="tr53form('+x.id+')">✏️ '+(ar?'تعديل':'Edit')+'</button><button class="gh" onclick="tr53del('+x.id+')">🗑️ '+(ar?'حذف':'Delete')+'</button></div>').join(''):'<div class="tip">'+(ar?'لا توجد جلسات مسجلة':'No sessions logged yet')+'</div>'}
function tr53del(id){if(!confirm(S.lg==='ar'?'حذف جلسة التدريب؟':'Delete training session?'))return;tr53save(tr53get().filter(x=>x.id!=id));train53()}
function tr53export(){let b=new Blob([JSON.stringify(tr53get(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Abqari_HSE_Training_Sessions_Phase53.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

</script>
